AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AccraCare hospital appointment booking system.
  API Gateway + Lambda + DynamoDB backend, with SNS notifications,
  CloudFront + S3 frontend hosting, CloudWatch monitoring, and AWS Budgets.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment stage name used in resource names and environment variables.
  BudgetLimitUsd:
    Type: Number
    Default: 5
    Description: Monthly AWS Budget ceiling in USD.
  BudgetAlertEmail:
    Type: String
    Description: Email address to receive AWS Budget threshold alerts.
  NotificationEmail:
    Type: String
    Description: Email address subscribed to the booking confirmation SNS topic.
  AdminApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Shared secret API key required for admin-only endpoints
      (createSlot, updateSlotStatus, getBookings, deleteBooking, etc.).
      Passed to Lambda functions via the ADMIN_API_KEY environment variable.
      MUST be a long, random value (e.g. openssl rand -hex 32).
  FrontendOrigin:
    Type: String
    Default: ''
    Description: >
      The CloudFront / frontend origin URL (e.g. https://d123.cloudfront.net)
      used to validate CORS requests. When empty, the stack's CloudFront URL
      is used automatically.

Conditions:
  HasFrontendOrigin: !Not [!Equals [!Ref FrontendOrigin, '']]

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        # Shared admin API key — required by all admin-protected endpoints.
        ADMIN_API_KEY: !Ref AdminApiKey
        # Prefer an explicit custom domain, otherwise trust this stack's
        # CloudFront distribution so the deployed frontend can call the API.
        FRONTEND_ORIGIN: !If
          - HasFrontendOrigin
          - !Ref FrontendOrigin
          - !Sub https://${FrontendCloudFrontDistribution.DomainName}

Resources:
  # ---------------------------------------------------------------------
  # API Gateway CloudWatch Logs account role (required for stage logging)
  # ---------------------------------------------------------------------
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # ---------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------
  ApiGatewayRestApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,x-api-key'"
        # SECURITY: Do NOT use '*' here. The Lambda response layer validates
        # the request Origin against the allow-list (CORS_ORIGINS / FRONTEND_ORIGIN).
        AllowOrigin: !If
          - HasFrontendOrigin
          - !Sub "'${FrontendOrigin}'"
          - !Sub "'https://${FrontendCloudFrontDistribution.DomainName}'"
        MaxAge: "'600'"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          LoggingLevel: ERROR
          # SECURITY: DataTraceEnabled must stay false — it logs full request
          # and response bodies (including patient PII) to CloudWatch.
          DataTraceEnabled: false
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      TracingEnabled: true

  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/api-gateway/accra-hospital-api-${Stage}
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------
  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub accra-hospital-appointments-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appointmentId
          AttributeType: S
        - AttributeName: patientEmail
          AttributeType: S
        - AttributeName: doctorId
          AttributeType: S
      KeySchema:
        - AttributeName: appointmentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: patientEmail-index
          KeySchema:
            - AttributeName: patientEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: doctorId-index
          KeySchema:
            - AttributeName: doctorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DoctorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub accra-hospital-doctors-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doctorId
          AttributeType: S
      KeySchema:
        - AttributeName: doctorId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub accra-hospital-patients-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patientEmail
          AttributeType: S
      KeySchema:
        - AttributeName: patientEmail
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub accra-hospital-slots-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub accra-hospital-bookings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: slotId
          AttributeType: S
        - AttributeName: patientEmail
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: slotId-index
          KeySchema:
            - AttributeName: slotId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: patientEmail-index
          KeySchema:
            - AttributeName: patientEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------
  # SNS Topics
  # ---------------------------------------------------------------------
  BookingConfirmationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub accra-hospital-booking-confirmations-${Stage}
      KmsMasterKeyId: alias/aws/sns

  BookingConfirmationsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BookingConfirmationsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub accra-hospital-ops-alerts-${Stage}
      KmsMasterKeyId: alias/aws/sns

  OpsAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref BudgetAlertEmail

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub accra-hospital-monthly-budget-${Stage}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL

  # ---------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-health-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/health.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /health
            Method: get

  StatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-status-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/status.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        Status:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /status
            Method: get

  ListDoctorsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-list-doctors-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/listDoctors.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DoctorsTable
      Events:
        GetDoctors:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /doctors
            Method: get

  CreateDoctorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-create-doctor-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/createDoctor.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          DOCTORS_TABLE: !Ref DoctorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DoctorsTable
      Events:
        PostDoctor:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /doctors
            Method: post

  ListAppointmentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-list-appointments-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/listAppointments.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        GetAppointments:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /appointments
            Method: get

  CreateAppointmentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-create-appointment-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/createAppointment.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        PostAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /appointments
            Method: post

  GetAppointmentsByEmailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-get-appointments-by-email-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/getAppointmentsByEmail.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        GetAppointmentsByEmail:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /appointments/{id}
            Method: get

  DeleteAppointmentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-delete-appointment-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/deleteAppointment.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentsTable
      Events:
        DeleteAppointment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /appointments/{id}
            Method: delete

  DeleteBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub accra-hospital-delete-booking-${Stage}
      Runtime: python3.12
      CodeUri: backend/lambdas/
      Handler: delete_booking.lambda_handler
      Environment:
        Variables:
          BOOKINGS_TABLE: !Ref BookingsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
      Events:
        DeleteBooking:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /bookings/{id}
            Method: delete

  GetBookingsByEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub accra-hospital-get-bookings-by-email-${Stage}
      Runtime: python3.12
      CodeUri: backend/lambdas/
      Handler: get_bookings_by_email.lambda_handler
      Environment:
        Variables:
          BOOKINGS_TABLE: !Ref BookingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
      Events:
        GetBookingsByEmail:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /bookings/by-email/{email}
            Method: get

  GetSlotsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-get-slots-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/getSlots.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          SLOTS_TABLE: !Ref SlotsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SlotsTable
      Events:
        GetSlots:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /slots
            Method: get

  CreateSlotFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-create-slot-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/createSlot.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          SLOTS_TABLE: !Ref SlotsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlotsTable
      Events:
        PostSlot:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /slots
            Method: post

  BookSlotFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-book-slot-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/bookSlot.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          SLOTS_TABLE: !Ref SlotsTable
          BOOKINGS_TABLE: !Ref BookingsTable
          SNS_TOPIC_ARN: !Ref BookingConfirmationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - SNSPublishMessagePolicy:
            TopicName: !Sub accra-hospital-booking-confirmations-${Stage}
      Events:
        PostBookSlot:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /slots/{slotId}/book
            Method: post

  GetBookingsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-get-bookings-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/getBookings.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          BOOKINGS_TABLE: !Ref BookingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
      Events:
        GetBookings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /bookings
            Method: get

  UpdateSlotStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Minify: false
        Sourcemap: true
    Properties:
      FunctionName: !Sub accra-hospital-update-slot-status-${Stage}
      Runtime: nodejs22.x
      Handler: handlers/updateSlotStatus.lambdaHandler
      CodeUri: backend/src/
      Environment:
        Variables:
          SLOTS_TABLE: !Ref SlotsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlotsTable
      Events:
        PatchSlotStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayRestApi
            Path: /slots/{slotId}/status
            Method: patch

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub accra-hospital-frontend-${Stage}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub accra-hospital-frontend-oac-${Stage}
        Description: Allow CloudFront to read the private frontend bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendCloudFrontDistribution}
          - Sid: DenyNonHttps
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub arn:aws:s3:::${FrontendBucket}
              - !Sub arn:aws:s3:::${FrontendBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  FrontendCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # 5% error-rate alarm across all Lambda invocations (assignment requirement)
  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub accra-hospital-lambda-error-rate-${Stage}
      AlarmDescription: Fires when Lambda error rate exceeds 5% over 5 minutes
      Metrics:
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: errorRate
          Expression: "errors / invocations * 100"
          Label: ErrorRatePercent
          ReturnData: true
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub accra-hospital-api-gateway-5xx-${Stage}
      AlarmDescription: Fires when API Gateway returns one or more 5xx errors over 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub accra-hospital-api-${Stage}
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  CloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub accra-hospital-dashboard-${Stage}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CreateAppointmentFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateAppointmentFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${CreateAppointmentFunction}"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Appointment Function Activity"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["AWS/ApiGateway", "5XXError", "ApiName", "accra-hospital-api-${Stage}", "Stage", "${Stage}"],
                  ["AWS/ApiGateway", "Count", "ApiName", "accra-hospital-api-${Stage}", "Stage", "${Stage}"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "API Gateway Errors vs Requests"
              }
            }
          ]
        }

Outputs:
  ApiBaseUrl:
    Description: Base URL for the REST API
    Value: !Sub https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
  FrontendWebsiteUrl:
    Description: HTTPS CloudFront URL for the frontend
    Value: !Sub https://${FrontendCloudFrontDistribution.DomainName}
  FrontendDistributionId:
    Description: CloudFront distribution ID for cache invalidation
    Value: !Ref FrontendCloudFrontDistribution
  AppointmentsTableName:
    Description: DynamoDB appointments table name
    Value: !Ref AppointmentsTable
  DoctorsTableName:
    Description: DynamoDB doctors table name
    Value: !Ref DoctorsTable
  PatientsTableName:
    Description: DynamoDB patients table name
    Value: !Ref PatientsTable
  SlotsTableName:
    Description: DynamoDB slots table name for legacy slot management
    Value: !Ref SlotsTable
  BookingsTableName:
    Description: DynamoDB bookings table name for legacy booking records
    Value: !Ref BookingsTable
  OpsAlertsTopicArn:
    Value: !Ref OpsAlertsTopic
  BookingConfirmationsTopicArn:
    Value: !Ref BookingConfirmationsTopic
