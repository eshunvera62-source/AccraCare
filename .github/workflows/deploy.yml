name: Deploy AccraCare Capstone

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: accra-hospital-capstone

jobs:
  test:
    name: Run Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install boto3 pytest

      - name: Run seed unit tests
        working-directory: backend/seed
        run: python -m unittest discover -v

  build_and_deploy:
    name: SAM build and deploy
    runs-on: ubuntu-latest
    needs: test
    outputs:
      api_base_url: ${{ steps.stack_outputs.outputs.api_base_url }}
      frontend_bucket_name: ${{ steps.stack_outputs.outputs.frontend_bucket_name }}
      frontend_distribution_id: ${{ steps.stack_outputs.outputs.frontend_distribution_id }}
      slots_table_name: ${{ steps.stack_outputs.outputs.slots_table_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Node.js dependencies
        run: npm install
        working-directory: backend/src

      - name: SAM validate
        run: sam validate --lint

      - name: SAM build
        run: sam build

      - name: Delete stack if in ROLLBACK_COMPLETE
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack in ROLLBACK_COMPLETE — deleting before redeploy"
            aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }}
            aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }}
          fi

      - name: SAM deploy
        run: |
          ADMIN_API_KEY="${{ secrets.ADMIN_API_KEY }}"
          FRONTEND_ORIGIN="${{ secrets.FRONTEND_ORIGIN }}"
          parameters=(
            "Stage=dev"
            "BudgetLimitUsd=5"
            "BudgetAlertEmail=${{ secrets.BUDGET_ALERT_EMAIL }}"
            "NotificationEmail=${{ secrets.NOTIFICATION_EMAIL }}"
          )

          # Omit empty optional parameters: SAM rejects arguments such as
          # AdminApiKey=. With no key, handlers fail closed (401) by design.
          if [ -n "$ADMIN_API_KEY" ]; then
            parameters+=("AdminApiKey=$ADMIN_API_KEY")
          else
            echo "::warning::ADMIN_API_KEY is not set; admin endpoints will fail closed"
          fi

          if [ -n "$FRONTEND_ORIGIN" ]; then
            parameters+=("FrontendOrigin=$FRONTEND_ORIGIN")
          fi

          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parameters[@]}"

      - name: Capture stack outputs
        id: stack_outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          echo "api_base_url=$(get_output ApiBaseUrl)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket_name=$(get_output FrontendBucketName)" >> "$GITHUB_OUTPUT"
          echo "frontend_distribution_id=$(get_output FrontendDistributionId)" >> "$GITHUB_OUTPUT"
          echo "slots_table_name=$(get_output SlotsTableName)" >> "$GITHUB_OUTPUT"

  seed_data:
    name: Seed DynamoDB slots table
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install boto3
        run: pip install boto3

      - name: Load seed slots
        working-directory: backend/seed
        run: |
          python load_seed_data.py "${{ needs.build_and_deploy.outputs.slots_table_name }}" --region ${{ env.AWS_REGION }}

  deploy_frontend:
    name: Sync frontend to S3
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inject deployed API URL into frontend
        run: |
          API_URL="${{ needs.build_and_deploy.outputs.api_base_url }}"
          if [ -z "$API_URL" ]; then
            echo "::error::API base URL is empty — cannot inject into frontend"
            exit 1
          fi
          sed -i "s#REPLACE_WITH_YOUR_API_GATEWAY_INVOKE_URL#${API_URL}#g" frontend/scripts/api.js
          if grep -q "REPLACE_WITH_YOUR_API_GATEWAY_INVOKE_URL" frontend/scripts/api.js; then
            echo "::error::Placeholder was not replaced in frontend/scripts/api.js"
            exit 1
          fi
          echo "Injected API URL: ${API_URL}"

      - name: Sync to S3
        run: |
          aws s3 sync frontend/ "s3://${{ needs.build_and_deploy.outputs.frontend_bucket_name }}" --sse AES256 --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID="${{ needs.build_and_deploy.outputs.frontend_distribution_id }}"
          if [ -z "$DIST_ID" ]; then
            echo "::error::CloudFront distribution ID is empty — cannot invalidate cache"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --output text \
            --query 'Invalidation.{Id:Id,Status:Status}'
